name: Build desktop installers

# Builds the OpenGene desktop app for macOS and Windows.
# - Runs on demand (workflow_dispatch) and on version tags (v*).
# - Produces unsigned installers today. Signing turns on automatically once the
#   documented secrets are present (see desktop/README.md); no YAML change needed.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    # A release/* branch also builds, for pushers that can't push tags
    # (e.g. automated sessions limited to branch pushes).
    branches:
      - "release/**"

# The build only reads the repository; it publishes nothing.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            builder_flag: "--mac --arm64"
          # Intel Macs. macos-13 was retired in Dec 2025; macos-15-intel is
          # GitHub's Intel image until the macOS 15 image retires (fall 2027).
          # PyInstaller can't cross-compile, so the x64 backend has to be built
          # on an Intel runner.
          - name: macOS (Intel)
            os: macos-15-intel
            builder_flag: "--mac --x64"
          - name: Windows (x64)
            os: windows-latest
            builder_flag: "--win --x64"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- backend: standalone executable via PyInstaller ----------------
      - name: Build backend executable
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller opengene-backend.spec --noconfirm

      # --- frontend: static build ----------------------------------------
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # --- desktop: Electron installer -----------------------------------
      - name: Build desktop installer
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Signing secrets (see desktop/README.md). GitHub doesn't export
          # secrets by itself, and an unset secret arrives as an empty string,
          # which electron-builder would try to use as a certificate and fail.
          # So they come in under SECRET_* names and are exported below only
          # when they have a value; with none set, the build stays unsigned.
          SECRET_MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SECRET_MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # Each platform gets only its own certificate. (Runs under bash -e,
          # so use if-blocks: a bare `[ -n ... ] && export` would end the step.)
          export_if_set() {
            if [ -n "$2" ]; then
              export "$1=$2"
              echo "signing: $1 is set"
            fi
          }
          if [ "$RUNNER_OS" = "macOS" ]; then
            export_if_set CSC_LINK "$SECRET_MAC_CSC_LINK"
            export_if_set CSC_KEY_PASSWORD "$SECRET_MAC_CSC_KEY_PASSWORD"
            export_if_set APPLE_ID "$SECRET_APPLE_ID"
            export_if_set APPLE_APP_SPECIFIC_PASSWORD "$SECRET_APPLE_APP_SPECIFIC_PASSWORD"
            export_if_set APPLE_TEAM_ID "$SECRET_APPLE_TEAM_ID"
          else
            export_if_set WIN_CSC_LINK "$SECRET_WIN_CSC_LINK"
            export_if_set WIN_CSC_KEY_PASSWORD "$SECRET_WIN_CSC_KEY_PASSWORD"
          fi
          npm ci
          npm run dist -- ${{ matrix.builder_flag }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: opengene-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error
