[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opengene"
version = "0.1.0"
description = "Open-source, AI-native plasmid editor — deterministic sequence engine and REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "biopython>=1.83",
    "primer3-py>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["opengene*"]

[tool.setuptools.package-data]
opengene = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
