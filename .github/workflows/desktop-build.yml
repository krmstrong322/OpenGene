name: Build desktop installers

# Builds the OpenGene desktop app for macOS and Windows.
# - Runs on demand (workflow_dispatch) and on version tags (v*).
# - Produces unsigned installers today. Signing turns on automatically once the
#   documented secrets are present (see desktop/README.md); no YAML change needed.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-15
            builder_flag: "--mac --arm64"
          # Intel Macs. macos-13 was retired in Dec 2025; macos-15-intel is
          # GitHub's Intel image until the macOS 15 image retires (fall 2027).
          # PyInstaller can't cross-compile, so the x64 backend has to be built
          # on an Intel runner.
          - name: macOS (Intel)
            os: macos-15-intel
            builder_flag: "--mac --x64"
          - name: Windows (x64)
            os: windows-latest
            builder_flag: "--win --x64"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- backend: standalone executable via PyInstaller ----------------
      - name: Build backend executable
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller opengene-backend.spec --noconfirm

      # --- frontend: static build ----------------------------------------
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # --- desktop: Electron installer -----------------------------------
      - name: Build desktop installer
        working-directory: desktop
        env:
          # Leave signing off until secrets are configured. electron-builder
          # reads CSC_LINK / CSC_KEY_PASSWORD (and Apple notarize vars) from the
          # environment; absent, it builds unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run dist -- ${{ matrix.builder_flag }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: opengene-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error
